name: Build
on:
  push:
    branches:
      - main
      - 'sprint*'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - 'sprint*'

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    if: github.ref_name == 'main' && !contains(github.ref_name, '-')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
