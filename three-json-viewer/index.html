<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Three JSON Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; }
      canvas { display: block; }
      .hud {
        position: fixed;
        top: 12px;
        left: 12px;
        background: rgba(0,0,0,.6);
        color: white;
        padding: 10px 12px;
        border-radius: 10px;
        font-family: system-ui;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="hud">
      Souris : tourner / zoom / déplacer
    </div>
    <script type="module" src="/src/main.js"></script>
    <div id="tooltip"
      style="
        position: fixed;
        pointer-events: none;
        background: rgba(0,0,0,0.7);
        color: white;
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 12px;
        font-family: system-ui;
        display: none;
        ">
    </div>
  </body>
</html>
